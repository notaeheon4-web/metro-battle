
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metro Battle</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="game">

<h1>🚇 Metro Battle</h1>
<h2>지하철역 맞추기</h2>

<div class="box">

<div class="score">

</div>

</div>


<script src="script.js"></script>
